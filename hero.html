<style>
  :root {
    color-scheme: dark;
    --bg: #060a0f;
    --bg-glow: #101010;
    --fg: #ffffff;
    --muted: #a0a0a0;
    --plate: rgba(8, 8, 8, 0.9);
    --plate-border: rgba(255, 255, 255, 0.16);
    --plate-edge: rgba(255, 255, 255, 0.5);
    --bar-top: #ffffff;
    --bar-bottom: rgba(255, 255, 255, 0.16);
    --font-display: "Chakra Petch", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-display);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .stage {
    position: relative;
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 20px;
    background:
      radial-gradient(120% 90% at 50% 0%, var(--bg-glow) 0%, transparent 60%),
      var(--bg);
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---- equalizer built from CSS boxes ---- */
  .equalizer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 9px;
    overflow: hidden;
  }

  .bar {
    flex: 0 0 15px;
    width: 15px;
    height: calc(var(--h) * 100%);
    border-radius: 2px;
    background: linear-gradient(to top, var(--bar-bottom), var(--bar-top));
    transform-origin: bottom center;
    transform: scaleY(0.4);
    animation: wave var(--d, 1.7s) ease-in-out infinite;
    animation-delay: calc(var(--i) * -0.06s);
    will-change: transform;
  }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.22); }
    50%      { transform: scaleY(1); }
  }

  /* ---- sharp box behind the text ---- */
  .plate {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: clamp(1.4rem, 4vw, 2.4rem) clamp(2rem, 7vw, 4.5rem);
    border-radius: 8px;
    background: var(--plate);
    border: 1.5px solid var(--plate-border);
    box-shadow:
      inset 0 1px 0 var(--plate-edge),
      0 24px 70px rgba(0,0,0,0.6);
  }

  .name {
    margin: 0;
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 6rem);
    line-height: 0.98;
    letter-spacing: 0.02em;
    color: var(--fg);
    text-shadow: 0 0 30px rgba(255,255,255,0.18);
    text-wrap: balance;
  }

  .role {
    margin: clamp(0.55rem, 1.5vw, 0.9rem) 0 0;
    font-weight: 600;
    font-size: clamp(0.72rem, 2.3vw, 0.95rem);
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .bar { animation: none; transform: scaleY(0.6); }
  }
</style>
