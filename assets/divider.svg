<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="48" viewBox="0 0 1000 48" role="img" aria-label="Neon white glow section divider">
  <defs>
    <linearGradient id="neonFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.84" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-5%" y="-600%" width="110%" height="1300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="glowInner"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="glowOuter"/>
      <feMerge>
        <feMergeNode in="glowOuter"/>
        <feMergeNode in="glowInner"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="32" y="22" width="936" height="4" rx="2" fill="url(#neonFade)" filter="url(#neonGlow)"/>
</svg>
